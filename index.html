<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viatu Poa - Online Shoe Selling in Kenya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Viatu Poa</h1>
    <p>Online Shoe Selling in Kenya</p>
  </header>

  <main>
    <h2>Our Shoes</h2>
    <div id="products"></div>

    <h2>Your Cart</h2>
    <div id="cart">
      <ul id="cart-items"></ul>
      <p>Items: <span id="item-count">0</span></p>
      <p>Subtotal: KSh <span id="subtotal">0</span></p>
      <p>Discount: KSh <span id="discount">0</span></p>
      <p>Delivery: KSh <span id="delivery">0</span></p>
      <h3>Total: KSh <span id="total">0</span></h3>
      <p id="message"></p>
      <button id="clear-btn">Clear Cart</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Viatu Poa - Nairobi, Kenya</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
